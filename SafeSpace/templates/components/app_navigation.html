{% load static %}
<header class="app-topbar">
    <a class="app-brand" href="{% url 'home' %}" aria-label="SafeSpace, início">
        <img class="app-brand-icon"
             src="{% static 'SafeSpace/img/icon_safe_place.png' %}" alt="">
        <span>SafeSpace</span>
    </a>

    <nav class="app-tabs" aria-label="Menu principal" data-app-tabs>
        <a class="app-tab{% if active_page == 'home' %} is-active{% endif %}"
           href="{% url 'home' %}"{% if active_page == 'home' %} aria-current="page"{% endif %}>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
            <span>Início</span>
        </a>
        <a class="app-tab{% if active_page == 'diary' %} is-active{% endif %}"
           href="{% url 'diary' %}"{% if active_page == 'diary' %} aria-current="page"{% endif %}>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2zM6 18a2 2 0 0 1 2-2h11M10 8h5"/></svg>
            <span>Diário</span>
        </a>
        <a class="app-tab{% if active_page == 'health' %} is-active{% endif %}"
           href="{% url 'health' %}"{% if active_page == 'health' %} aria-current="page"{% endif %}>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
            <span>Saúde</span>
        </a>
        <a class="app-tab app-tab--sos{% if active_page == 'sos' %} is-active{% endif %}"
           href="{% url 'sos' %}"{% if active_page == 'sos' %} aria-current="page"{% endif %}>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6zM12 9v6M9 12h6"/></svg>
            <span>SOS</span>
        </a>
    </nav>

    <div class="app-topbar-actions">
        <div class="app-notification-wrap">
            <button class="icon-button" type="button" aria-label="Notificações"
                    aria-expanded="false" aria-controls="app-notification-panel"
                    data-notification-toggle>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
                </svg>
            </button>
            <section class="app-popover app-notification-panel"
                     id="app-notification-panel" aria-label="Notificações"
                     data-notification-panel hidden>
                <h2>Notificações</h2>
                <div class="app-notification-empty">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg>
                    <p>Tudo tranquilo por aqui. Quando houver novidades, elas aparecerão aqui.</p>
                </div>
            </section>
        </div>

        <details class="app-profile-menu">
            <summary class="app-profile-trigger" aria-label="Abrir opções do perfil">
                {% if profile_image_url %}
                <img class="profile-avatar" src="{{ profile_image_url }}" alt="">
                {% else %}
                <span class="profile-avatar profile-initials" aria-hidden="true">{{ profile_initials }}</span>
                {% endif %}
            </summary>
            <div class="app-popover app-profile-popover">
                <p class="app-profile-popover-name">{{ display_name }}</p>
                <a class="app-popover-link" href="{% url 'profile' %}">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>
                    Meu perfil
                </a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="app-popover-link app-logout-button" type="submit">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg>
                        Sair da conta
                    </button>
                </form>
            </div>
        </details>
    </div>
</header>
