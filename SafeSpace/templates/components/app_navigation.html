{% load static %}
<button class="app-menu-backdrop" type="button" aria-label="Fechar menu"
        data-menu-backdrop hidden></button>

<header class="app-topbar">
    <div class="app-topbar-start">
        <button class="icon-button app-menu-toggle" type="button"
                aria-label="Abrir menu" aria-expanded="false"
                aria-controls="app-main-menu" data-menu-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <a class="app-brand" href="{% url 'home' %}" aria-label="SafeSpace, início">
            <img class="app-brand-mark app-brand-icon"
                 src="{% static 'SafeSpace/img/icon_safe_place.png' %}" alt="">
            <span>SafeSpace</span>
        </a>
    </div>

    <div class="app-topbar-actions">
        <div class="app-notification-wrap">
            <button class="icon-button" type="button" aria-label="Notificações"
                    aria-expanded="false" aria-controls="app-notification-panel"
                    data-notification-toggle>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
                </svg>
            </button>
            <section class="app-popover app-notification-panel"
                     id="app-notification-panel" aria-label="Notificações"
                     data-notification-panel hidden>
                <h2>Notificações</h2>
                <p>Quando houver novidades, elas aparecerão aqui.</p>
            </section>
        </div>

        <details class="app-profile-menu">
            <summary class="app-profile-trigger" aria-label="Abrir opções do perfil">
                {% if profile_image_url %}
                <img class="profile-avatar" src="{{ profile_image_url }}" alt="">
                {% else %}
                <span class="profile-avatar profile-initials" aria-hidden="true">{{ profile_initials }}</span>
                {% endif %}
            </summary>
            <div class="app-popover app-profile-popover">
                <p class="app-profile-popover-name">{{ display_name }}</p>
                <a class="app-popover-link" href="{% url 'profile' %}">Meu perfil</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="app-popover-link app-logout-button" type="submit">Sair da conta</button>
                </form>
            </div>
        </details>
    </div>
</header>

<nav class="app-main-menu" id="app-main-menu" aria-label="Menu principal" data-main-menu hidden>
    <a class="app-menu-link{% if active_page == 'diary' %} is-active{% endif %}"
       href="{% url 'diary' %}"{% if active_page == 'diary' %} aria-current="page"{% endif %}>
        <span aria-hidden="true">✎</span> Diário
    </a>
    <a class="app-menu-link{% if active_page == 'health' %} is-active{% endif %}"
       href="{% url 'health' %}"{% if active_page == 'health' %} aria-current="page"{% endif %}>
        <span aria-hidden="true">♡</span> Saúde
    </a>
    <a class="app-menu-link{% if active_page == 'sos' %} is-active{% endif %}"
       href="{% url 'sos' %}"{% if active_page == 'sos' %} aria-current="page"{% endif %}>
        <span aria-hidden="true">✚</span> SOS
    </a>
</nav>
